name: 🗼 Access to the Forbidden Fortress

on: push

jobs:
  access-to-the-database:
    runs-on: ubuntu-latest

    steps:
      - name: The agent introduces himself
        run: |
          echo "Agent ${{ github.actor }} arrives at the fortress"
          echo ""
          echo "Search the Legion's archives"
          ls -la
          echo ""
          echo "❌ But what happened? There's nothing there."

      - name: 'Brainiac unlocks the vault'
        uses: actions/checkout@v4

      - name: Now then, let's take a look at the plans
        run: |
          echo "Search the Legion's archives"
          ls -la
          echo "✅ It works!!!"
          echo ""
          echo "Plans:"
          ls plans/
          echo "Villains:"
          ls members/
          echo "Intelligence:"
          ls intelligence/
