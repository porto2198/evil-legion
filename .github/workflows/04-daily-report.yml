name: Daily Domination Report
on:
  #  schedule:
  #    # The cron fields are, in order:
  #    #  ┌───────────── minute (0 - 59)
  #    #  │ ┌───────────── time (0 - 23)
  #    #  │ │ ┌───────────── day of the month (1 - 31)
  #    #  │ │ │ ┌───────────── month (1 - 12)
  #    #  │ │ │ │ ┌───────────── day of the week (0 - 6; 0 = Sunday)
  #    #  │ │ │ │ │
  #    - cron: "0 8 * * *"  # Every day at 8:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Brainiac enters the base
        uses: actions/checkout@v4

      - name: Generate a ownership report
        run: |
          # Obtain an interesting piece of information such as “intercepted intelligence”
          DATA=$(curl -s "https://uselessfacts.jsph.pl/api/v2/facts/random?language=en" | python3 -c "import sys,json; print(json.load(sys.stdin)['text'])" 2>/dev/null || echo "Transmission error. The heroes might be blocking our signal.")

          # Get Date
          DATE=$(date -u +"%d de %B de %Y - %H:%M UTC")

          # Generate a random number for system reports


          # This generates a random number between 90 and 100 (inclusive)
          # RANDOM % 11 Generates a number between 0 and 10, then adds 90 -> range 90–100
          SHIELD=$((RANDOM % 11 + 90))

          # This generates a random number between 16 and 20 (inclusive)
          # RANDOM % 5 Generates a number between 0 and 4, then adds 16 -> range 16–20
          DRONES=$((RANDOM % 5 + 16))

          SURVEILLANCE=$((RANDOM % 6 + 95))

          # Write the report at the end of the README
          cat >> README.md << EOF

          ---

          ## 📊 Brainiac's Daily Report

          **Date:** ${DATE}

          **Operating Status:**
          - 📡 Systems of the Forbidden City: ✅ Online
          - 🌙 Lunar Base: ⚠️ Operational with restrictions
          - 🛰️ Glacier Project-1: In progress
          - 🧬 Project Krypton: In planning

          **Metrics of the Day:**
          - Magneto's Electromagnetic Shield: ${SHIELD}% in capacity
          - Active Brainiac Drones: ${DRONES}/20
          - Global Surveillance Coverage: ${SURVEILLANCE}%

          **Intelligence Intercept of the Day:**
          > ${DATA}

          _Report automatically generated by Brainiac v12.0_
          _"Data doesn't lie. Living beings do."_
          EOF

      - name: Brainiac files the report
        run: |
          git config user.name "Brainiac"
          git config user.email "brainiac@legion-of-evil.dev"
          git add README.md
          git commit -m "📊 Daily Domination Report - $(date -u +%Y-%m-%d)"
          git push